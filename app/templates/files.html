<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>文件列表</title>
</head>
<body>
    <div>
    <form method=post enctype=multipart/form-data>
      <input type=file name=file>
      <input type=submit value=Upload>
    </form>
    </div>
    <h1>文件列表</h1>
    <div>
    <ul>
        {% for file in files %}
	<li><a href="/uploads/{{ file }}">{{ file }}</a></li>
        {% endfor %}
    </ul>
    </div>
</body>
</html>
